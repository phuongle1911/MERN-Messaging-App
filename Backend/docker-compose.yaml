services:

  mongo:
    image: mongo:8.2.3
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: '${DB_USER:-admin}'
      MONGO_INITDB_ROOT_PASSWORD: '${DB_PASSWORD:-password}'
    volumes:
      - mongo-data:/data/db
    ports:
      - '${DB_PORT:-27017}:27017'
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh mongodb://${DB_USER}:${DB_PASSWORD}@localhost:27017/?authSource=admin --quiet
      interval: 30s
      timeout: 10s
      retries: 5    
    networks:
      - messageapp-network
  

# development environment
  app-dev:
    image: backend-app-dev:latest
    build: 
      context: .
      target: development
    container_name: backend
    depends_on:
      mongo:
        condition: service_healthy
    ports: 
      - '${PORT:-3000}:3000'
    env_file: .env
    environment:
      NODE_ENV: development
      DB_NAME: '${DB_NAME:-DatingAppDatabase}'
      MONGODB_HOST: mongodb
      AUTH_SOURCE: 'admin'
      DB_USER: '${DB_USER:-admin}'
      DB_PASSWORD: '${DB_PASSWORD:-password}'
    volumes:
      - ./src:/app/src:ro
    develop:
      watch: 
        - action: sync
          path: ./src
          target: /app/src
          ignore: 
            - '**/test/**'
            - '**/*.test.*'
        - action: rebuild
          path: ./package.json
    networks:
      - messageapp-network

  app-prod:
    image: message-app-prod:latest
    build:
      context: ../
      target: production
      dockerfile: ./Backend/Dockerfile
    container_name: fullstack-message-app
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      DB_NAME: '${DB_NAME:-DatingAppDatabase}'
      MONGODB_HOST: mongodb
      AUTH_SOURCE: 'admin'
      DB_USER: '${DB_USER:-admin}'
      DB_PASSWORD: '${DB_PASSWORD:-password}'
    depends_on:
      mongo:
        condition: service_healthy
    read_only: true
    profiles:
      - prod
    networks:
      - messageapp-network

volumes:
  mongo-data:
    driver: local

networks:
  messageapp-network:
    name: messageapp-network
    driver: bridge





