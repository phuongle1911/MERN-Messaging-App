name: Build and push Docker image to GHCR

on:
  push:
    tags: ["v*"]

  workflow_dispatch:
    inputs:
      new-version-tag:
        required: true
        type: string
      environment:
        type: choice
        required: true
        options:
          - development
          - production
        default: 'production'


jobs:
  backend_dev:
    name: backend dev
    if: ${{ inputs.environment == 'development' }}
    uses: ./.github/workflows/cd-ghcr-callable.yml
    with: 
      DOCKER_PATH: ./Backend
      target: "development"
      new-version-tag: ${{ inputs.new-version-tag }}
      environment: ${{ inputs.environment }}

  frontend_dev:
    name: frontend dev
    if: ${{ inputs.environment == 'development' }}
    uses: ./.github/workflows/cd-ghcr-callable.yml
    with: 
      DOCKER_PATH: ./Frontend
      target: "development"
      new-version-tag: ${{ inputs.new-version-tag }}
      environment: ${{ inputs.environment}}

  app_prod:
    name: application production
    if: ${{ inputs.environment == 'production' }}
    uses: ./.github/workflows/cd-ghcr-callable.yml
    with:
      DOCKER_PATH: .
      target: "production"
      new-version-tag: ${{ inputs.new-version-tag }}
      environment: ${{ inputs.environment }}