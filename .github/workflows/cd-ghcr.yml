name: Build and push Docker image to GHCR

on:
  push:
    tags: ["v*"]

  workflow_dispatch:
    inputs:
      new-version-tag:
        required: true
        type: string
      environment:
        type: choice
        required: true
        options:
          - development
          - production
env:
  DEPLOY_ENV: ${{ inputs.environment || 'production' }}

jobs:
  backend_dev:
    name: backend dev
    if: ${{ env.DEPLOY_ENV == 'development' }}
    environment: ${{ env.DEPLOY_ENV }}
    uses: ./.github/workflows/cd-ghcr-callable.yml
    with: 
      DOCKER_PATH: ./Backend
      target: "development"
      new-version-tag: ${{ inputs.new-version-tag }}
      environment: ${{ env.DEPLOY_ENV }}

  frontend_dev:
    name: frontend dev
    if: ${{ env.DEPLOY_ENV == 'development' }}
    environment: ${{ env.DEPLOY_ENV }}
    uses: ./.github/workflows/cd-ghcr-callable.yml
    with: 
      DOCKER_PATH: ./Frontend
      target: "development"
      new-version-tag: ${{ inputs.new-version-tag }}
      environment: ${{ env.DEPLOY_ENV }}

  app_prod:
    name: application production
    if: ${{ env.DEPLOY_ENV == 'production' }}
    environment: ${{ env.DEPLOY_ENV }}
    uses: ./.github/workflows/cd-ghcr-callable.yml
    with:
      DOCKER_PATH: .
      target: "production"
      new-version-tag: ${{ inputs.new-version-tag }}
      environment: ${{ env.DEPLOY_ENV }}