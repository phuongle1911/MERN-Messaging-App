  #     DOCKER_PATH: ./Backend/Dockerfile
  #     target: "development"
  #     new-version-tag: ${{ inputs.new-version-tag }}
  #     environment: "development"
  #     branch: "backend"

  frontend_dev:
    name: frontend dev
    uses: ./.github/workflows/cd-ghcr-callable.yml
    with: 
      DOCKER_PATH: ./Frontend/Dockerfile
      target: "development"
      new-version-tag: ${{ inputs.new-version-tag }}
      environment: "development"
      branch: "frontend"
