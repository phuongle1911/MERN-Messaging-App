name: Build and push Frontend Docker image to GHCR - development

on:
  push:
    tags: ["v*"]

  workflow_dispatch:
    inputs:
      new-version-tag:
        required: true
        type: string



jobs:

  frontend_dev:
    name: frontend dev
    uses: ./.github/workflows/cd-ghcr-callable.yml
    with: 
      DOCKER_PATH: ./Frontend/Dockerfile
      target: "development"
      new-version-tag: ${{ inputs.new-version-tag }}
      environment: "development"
