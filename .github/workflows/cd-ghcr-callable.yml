name: Callable workflow - Build and push Docker image to GHCR

on:
  workflow_call:
    inputs:
      docker_path:
        required: true
        type: string
        
      target:
        required: true
        type: string

      new-version-tag:
        required: true
        type: string

      environment:
        required: true
        type: string
      
      branch:
        required: true
        type: string


    # secrets:
    #   jwt_secret_key:
    #     required: false
jobs:
  build-image:
    runs-on: ubuntu-latest

    env:
      # ENV_TAG: ""
      VERSION_TAG: ""
      OWNER_LC: ""
      REPO_LC: ""
      
    permissions:
      packages: write
      contents: read

    environment: ${{ inputs.environment }}
    
    steps:
      - name: Checkout or clone a copy of the repo to the action runner
        uses: actions/checkout@v6

      - name: Get the image tag
        env:
          ACTIVE_TAG: '${{ inputs.new-version-tag || github.ref_name }}'
        run: |
          echo "VERSION_TAG=${ACTIVE_TAG,,}" >>${GITHUB_ENV}


      - name: Sanitise env data for Docker image tagging
        run: |
          echo "OWNER_LC=${OWNER,,}" >>${GITHUB_ENV}
          echo "REPO_LC=${REPO,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'
          REPO: '${{ github.repository }}'
          
      # Log in to our target container registry
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Additional helper for multi-platform image builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      # Another additional helper for multi-platform image builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Actual image building and image pushing
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          push: true
          file: ${{ inputs.docker_path}}
          tags: |
            ghcr.io/${{env.REPO_LC}}-${{inputs.branch}}-${{inputs.environment}}:latest
            ghcr.io/${{env.REPO_LC}}-${{inputs.branch}}-${{inputs.environment}}:${{env.VERSION_TAG}}
          target: ${{ inputs.target }}
          provenance: false

        

